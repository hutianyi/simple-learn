plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.hutianyi.simpledutv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hutianyi.simpledutv'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
